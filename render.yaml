# Database: managed Postgres via DATABASE_URL (Neon free tier recommended —
# Render's own free Postgres expires 30 days after creation and deletes data).
# Set DATABASE_URL in the Render dashboard to the provider's connection string.
# Locally, leave DATABASE_URL unset and the app falls back to SQLite.
services:
  - type: web
    name: neuromotion-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=. gunicorn backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Postgres connection string in the Render dashboard
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

# NOTE: The backend reads RENDER=true automatically on Render, which switches
# session cookies to SameSite=None; Secure. FRONTEND_URL must be set to the
# exact frontend origin (e.g. https://neuromotion-frontend.onrender.com) — it
# drives both CORS and the cookie policy.

  - type: web
    name: neuromotion-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neuromotion-backend
          envVarKey: RENDER_EXTERNAL_URL
