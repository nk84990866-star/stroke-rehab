services:
  - type: web
    name: neuromotion-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=. gunicorn backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

# NOTE: The backend reads RENDER=true automatically on Render, which switches
# session cookies to SameSite=None; Secure. FRONTEND_URL must be set to the
# exact frontend origin (e.g. https://neuromotion-frontend.onrender.com) — it
# drives both CORS and the cookie policy.

  - type: web
    name: neuromotion-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: neuromotion-backend
          envVarKey: RENDER_EXTERNAL_URL
